<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 360px; background: #0b1220; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.45; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .brand { font-weight: 900; letter-spacing: -0.02em; font-size: 17px; }
  .brand .r { color: #f87171; }
  .brand .or { color: #64748b; font-weight: 400; font-size: 12px; margin: 0 3px; }
  .brand .g { color: #34d399; }
  .chip { border: 1px solid rgba(129,140,248,0.5); background: rgba(129,140,248,0.12); color: #a5b4fc; border-radius: 999px; padding: 5px 11px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .chip:hover { background: rgba(129,140,248,0.22); }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 16px 12px; }
  .stat { border: 1px solid rgba(148,163,184,0.22); border-radius: 12px; padding: 10px 6px; text-align: center; background: rgba(15,23,42,0.5); }
  .stat .num { font-size: 21px; font-weight: 800; }
  .stat.bus .num { color: #34d399; }
  .stat.sus .num { color: #f87171; }
  .stat .lbl { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: #94a3b8; margin-top: 2px; }
  .card { border: 1px solid rgba(148,163,184,0.22); border-radius: 12px; padding: 12px; margin: 0 16px 12px; background: rgba(15,23,42,0.5); }
  .card-title { font-weight: 700; margin-bottom: 8px; }
  .snooze-on { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.07); }
  .snooze-on .card-title { color: #fbbf24; margin-bottom: 2px; }
  .hours { display: flex; flex-wrap: wrap; gap: 6px; }
  .hour { border: 1px solid rgba(148,163,184,0.3); background: transparent; color: #e2e8f0; border-radius: 999px; padding: 6px 11px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .hour:hover { background: rgba(52,211,153,0.16); border-color: rgba(52,211,153,0.55); color: #34d399; }
  .section { padding: 0 16px 12px; }
  .section-title { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: #94a3b8; margin: 2px 0 8px; }
  .site { display: flex; align-items: center; gap: 9px; border: 1px solid rgba(148,163,184,0.18); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .site[data-act] { cursor: pointer; }
  .site[data-act]:hover { background: rgba(148,163,184,0.08); }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .dot.bus { background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,0.5); }
  .dot.sus { background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,0.5); }
  .site-mid { flex: 1; min-width: 0; }
  .site-host { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-right { text-align: right; flex: none; }
  .badge { display: inline-block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; }
  .badge.bus { color: #34d399; }
  .badge.sus { color: #f87171; }
  .muted { color: #94a3b8; }
  .small { font-size: 11px; }
  .pad { padding: 8px 0; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .list { margin-bottom: 8px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid rgba(148,163,184,0.18); border-radius: 10px; padding: 6px 10px; margin-bottom: 4px; }
  .list-item span { word-break: break-all; }
  .x { background: none; border: none; color: #64748b; cursor: pointer; font-size: 13px; line-height: 1; padding: 3px 4px; flex: none; font-family: inherit; }
  .x:hover { color: #f87171; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; min-height: 34px; border-radius: 9px; border: 1px solid rgba(148,163,184,0.3); background: transparent; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .tab.on { background: rgba(129,140,248,0.16); border-color: rgba(129,140,248,0.55); color: #a5b4fc; }
  .btn { min-height: 36px; border-radius: 9px; border: 1px solid rgba(148,163,184,0.3); background: transparent; color: #e2e8f0; font-size: 12px; font-weight: 600; cursor: pointer; padding: 0 14px; font-family: inherit; }
  .btn:hover { background: rgba(148,163,184,0.12); }
  .btn.wide { width: 100%; margin-top: 10px; min-height: 40px; }
  .card input { width: 100%; min-height: 36px; border-radius: 9px; border: 1px solid rgba(148,163,184,0.3); background: rgba(2,6,23,0.6); color: #e2e8f0; padding: 0 10px; font-size: 13px; font-family: inherit; margin-bottom: 8px; }
  .card input:focus { outline: none; border-color: #818cf8; }
  .err { color: #f87171; font-size: 12px; margin-bottom: 6px; }
  .email { font-weight: 700; margin: 2px 0 6px; word-break: break-all; }
  footer { border-top: 1px solid rgba(148,163,184,0.18); padding: 10px 16px 12px; text-align: center; }
  footer a { color: #818cf8; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app"></div>
<script src="popup.js"></script>
</body>
</html>
